[project]
name = "multicloudshield"
version = "0.1.0"
description = "Read-only multi-cloud security posture management"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<27",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
azure = ["azure-identity>=1.25,<2", "azure-mgmt-resource>=23,<27", "azure-mgmt-resourcegraph>=8,<9", "azure-mgmt-storage>=22,<26", "azure-mgmt-network>=28,<33", "azure-mgmt-keyvault>=11,<15", "azure-mgmt-monitor>=6,<8", "azure-mgmt-authorization>=4,<5"]
gcp = ["google-auth>=2.35,<3", "google-cloud-storage>=2.18,<4", "google-cloud-compute>=1.20,<2", "google-cloud-kms>=3.0,<4", "google-cloud-asset>=3.26,<5", "google-cloud-resource-manager>=1.14,<2"]
ibm = ["ibm-cloud-sdk-core>=3.22,<4", "ibm-platform-services>=0.58,<1", "ibm-vpc>=0.27,<1", "ibm-cos-sdk>=2.13,<3"]
all-providers = ["multicloudshield[aws,azure,gcp,ibm]"]
dev = [
  "httpx>=0.27,<1",
  "import-linter>=2.1,<3",
  "mypy>=1.13,<3",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "types-PyYAML>=6.0.12.20250915",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
mcs = "multicloudshield.cli.app:app"
mcs-api = "multicloudshield.api.main:run"
mcs-worker = "multicloudshield.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multicloudshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: requires explicitly configured live cloud credentials", "integration: requires PostgreSQL 18"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "README.md", "CONTRIBUTING.md", "SECURITY.md", "CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"src/multicloudshield/core/enums.py" = ["S105"]
"src/multicloudshield/cli/app.py" = ["S105"]
"src/multicloudshield/api/main.py" = ["S104"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["multicloudshield"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
